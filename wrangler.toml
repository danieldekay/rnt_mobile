"$schema" = "./node_modules/wrangler/config-schema.json"

name = "rnt"
main = "./worker.ts"
compatibility_date = "2026-10-09"
keep_vars = true

[assets]
directory = "./build"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Public build-time vars for the SvelteKit client bundle.
# Referenced via `$env/dynamic/public` as PUBLIC_MATOMO_URL / PUBLIC_MATOMO_SITE_ID.
# These are embedded in the client JS (not secrets) — duplicating them here keeps
# CI builds self-contained without needing extra GitHub Actions inputs.
[vars]
PUBLIC_MATOMO_URL = "https://statistics.tangoparty.net"
PUBLIC_MATOMO_SITE_ID = "15"
SENDY_BASE_URL = "https://newsletter.rheinneckartango.de"

# SENDY_API_KEY and SENDY_LIST_ID are secrets — never store them here.
# Set them as Worker secrets via: wrangler secret put SENDY_API_KEY
# Set them as Worker secrets via: wrangler secret put SENDY_LIST_ID
# The API key is required for newsletter status checks (/api/newsletter/status).
# Without it, subscribe and unsubscribe still work; status checks return "unavailable".


# Route-scoped Workers Rate Limiting bindings.
# Namespace IDs are local project identifiers; keep them unique within the Cloudflare account.
[[ratelimits]]
name = "NEWSLETTER_NONCE_RATE_LIMITER"
namespace_id = "41001"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "NEWSLETTER_MUTATION_RATE_LIMITER"
namespace_id = "41002"

  [ratelimits.simple]
  limit = 15
  period = 60
