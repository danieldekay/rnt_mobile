name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker Assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test:run

      - name: Test smoke gate
        run: npm run test:smoke

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: WordPress API preflight
        run: npm run smoke:origin

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --message "GitHub Actions deploy ${GITHUB_SHA}"

      - name: Production smoke test
        run: |
          set -euo pipefail
          npm run smoke:origin
          npm run smoke:mobile
